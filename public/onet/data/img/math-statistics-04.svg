    <line x1="56" y1="190" x2="365" y2="190"/>
    <line x1="56" y1="165" x2="365" y2="165"/>
    <line x1="56" y1="140" x2="365" y2="140"/>
    <line x1="56" y1="115" x2="365" y2="115"/>
    <line x1="56" y1="90" x2="365" y2="90"/>
