<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 270" width="320" height="270" font-family="Tahoma, Arial, sans-serif" font-size="15">
  <rect width="320" height="270" fill="#fff"/>
  <!-- 1 cm = 14 px -->
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#c9d6f5"/>
      <line x1="0" y1="0" x2="0" y2="8" stroke="#6f86c9" stroke-width="2"/>
    </pattern>
  </defs>
  <rect x="52" y="20" width="196" height="196" fill="url(#hatch)" stroke="#18323d" stroke-width="2.5"/>
  <circle cx="150" cy="118" r="98" fill="#fff" stroke="#18323d" stroke-width="2.5"/>
  <circle cx="150" cy="118" r="3" fill="#18323d"/>
  <text x="150" y="240" text-anchor="middle" fill="#18323d" font-weight="bold">14 ซม.</text>
  <text x="258" y="123" fill="#18323d" font-weight="bold">14 ซม.</text>
</svg>
